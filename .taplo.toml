# taplo formats the TOML this project ships and nothing else.
#
# `target/` holds generated test fixtures, deliberately including a file whose
# bytes are not valid UTF-8 and a directory named `10-a.toml` — both exist to
# prove the rule loader refuses them. Letting the formatter walk into that
# directory makes `taplo fmt --check` fail for reasons that have nothing to do
# with the repository's own formatting.
#
# `.claude/` and `.boof-runner-worktrees/` hold other agents' git worktrees, each
# a whole checkout with its own fixtures and its own gate. This checkout's check
# must not fail on theirs.
exclude = [
  "target/**",
  "fuzz/target/**",
  ".claude/**",
  ".boof-runner-worktrees/**",
]

[formatting]
align_entries = false
array_trailing_comma = true
indent_string = "  "
