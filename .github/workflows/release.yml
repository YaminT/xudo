name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tag version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          expected_tag="v${workspace_version}"
          if [ "$TAG" != "$expected_tag" ]; then
            echo "tag $TAG does not match workspace version $expected_tag" >&2
            exit 1
          fi
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@d6912b47771be2c443ec90dbb3d28e023987e782 # v2.62.1
        with:
          tool: just
      - name: Test package
        run: just deb-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xudo-deb-${{ matrix.arch }}
          path: target/deb/xudo_*.deb
          if-no-files-found: error

  sign:
    name: Sign release artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: xudo-deb-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
        with:
          cosign-release: 'v2.4.1'
      - name: Create checksums and sign artifacts
        run: |
          sha256sum -- *.deb > SHA256SUMS
          for file in *.deb SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.cosign.bundle" "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xudo-release-artifacts
          path: |
            *.deb
            *.cosign.bundle
            SHA256SUMS
          if-no-files-found: error

  release:
    name: Draft release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xudo-release-artifacts
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --draft --prerelease --title "$TAG" ./*.deb ./SHA256SUMS ./*.cosign.bundle
