name: ci

# The gate. `just verify` locally runs the same commands, so a local pass and a
# CI failure is a bug in the justfile, not in CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # Nightly deep fuzz and a fresh advisory check, at an off-peak minute.
    - cron: "37 4 * * *"

env:
  CARGO_TERM_COLOR: always
  # A privilege broker should not be built with an unpinned toolchain.
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Green gate (macos-15) runs finish in 2m07s to 3m47s. 30 minutes is
    # room for a slow runner; a hang fails here, not at the 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS is the development platform and must stay green, because the
        # policy crate's whole point is that it builds and tests without Linux.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install toolchain
        # rust-toolchain.toml pins the channel and components.
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install gate tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.3,taplo-cli@0.10.0

      - name: Format
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: TOML format
        run: taplo fmt --check

      - name: Test
        run: just test

      - name: Doc tests
        run: just doc-test

      - name: Coverage (100%, three documented package exclusions)
        run: just coverage-clean && just coverage

      - name: Supply chain
        run: just supply-chain

      - name: GTFOBins gate
        run: just gtfobins

  cross:
    name: linux targets from the dev host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Type-check Linux targets
        run: just check-linux

  miri:
    name: undefined behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --component miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --lib only: see the justfile's miri recipe for why.
      - run: cargo +nightly miri test -p xudo-policy --lib

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    # The three trust-boundary parsers get a short run per push and a long run
    # on the nightly schedule.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2,just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fuzz (smoke)
        if: github.event_name != 'schedule'
        run: just fuzz-smoke
      - name: Fuzz (nightly, long)
        if: github.event_name == 'schedule'
        run: just fuzz 1800

  # Every systemd unit under packaging/, checked by systemd's own tools in a
  # Debian trixie container: `systemd-analyze verify` must say nothing, and
  # `systemd-analyze security --offline` must score each service within the
  # ceiling the justfile names. The lane first shows it can fail, against a
  # control unit it damages one way at a time. It skips, and says so, while
  # packaging/ holds no unit. Blocking from the start: once a unit exists there
  # is nothing to wait for.
  units:
    name: systemd units
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: systemd-analyze verify and security, offline, in Debian trixie
        run: just units

  # Release binaries and the real xudo CLI must not create Internet sockets.
  telemetry:
    name: no telemetry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Trace release binaries and xudo commands
        run: just telemetry

  # The tests that must run as uid 0, run as real root in a throwaway container,
  # on a copy of the checkout, and nothing else (ci/root-test.sh says why not the
  # whole suite). BLOCKING: the install executor's root tests (M2b step 5) are in
  # it, so a red lane is a red run. It began non-blocking, while it ran only its
  # own checks that a run which says it is root behaves like one, and the switch
  # was made in the commit that merged the install executor: `continue-on-error`
  # deleted, `root-test` added to the `ci` recipe in the justfile.
  # Branch protection lives outside this repository: if it lists required
  # checks, this job's name ("root tests (container)") has to be among them, or a
  # red lane still merges. Branch protection is configured outside this file.
  root-tests:
    name: root tests (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Root tests, as uid 0, on a copy of the checkout
        run: just root-test

  # The beta .deb built twice from one commit, from different checkout paths and
  # clean target directories, must match byte for byte. ci/repro/run.sh says what
  # is pinned and compares the package and the four binaries. It builds with the
  # same `just deb` recipe the release signs, on both architectures, without a
  # build cache.
  reproducible-build:
    name: reproducible build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: two_builds_of_the_same_commit_are_byte_identical
        run: just repro "$RUNNER_TEMP/repro-sha256.txt"
      # The release build job downloads this and fails if its own .deb differs.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-sha256-${{ matrix.arch }}
          path: ${{ runner.temp }}/repro-sha256.txt
          if-no-files-found: error

  # The differential compliance matrix: the static binary and the shipped
  # ruleset driven inside real distributions against real sudo, sudo-rs,
  # OpenDoas, and no escalator at all. ci/differential/run.sh pins what each
  # backend is probed to support, asks each backend's own parser to accept the
  # snippet xudo would write, and requires every verdict to be identical in
  # every row.
  #
  # It compares only what the unprivileged binary does, and says so: row.sh
  # fails the moment `xudo doctor` stops reporting the exec path as absent,
  # because then the same ruleset must be *executed* through each backend and
  # compared, and "we will add it later" is how it never gets added.
  differential:
    name: differential compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Drive the static binary through sudo, sudo-rs, OpenDoas, and no escalator
        run: just differential

  # `xudo install` and `--uninstall` run for real, as root, in containers the
  # job starts and discards: the file lands with the right owner and mode, the
  # backend's own parser accepts it first, an operator's file is never replaced
  # or removed, a rejected candidate leaves the old state alone. The functional
  # probe is not covered here because `xudo install` cannot yet ask the broker
  # for a request (M2b plan item C1); the harness asserts the install says it is
  # unverified rather than claiming otherwise. The root lane (`root-tests`) covers
  # the sudo path the probe will use, with a request written by hand.
  install-root:
    name: install as root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Install and uninstall through sudo, sudo-rs, and OpenDoas
        run: just install-root

  # Beta .deb: build it and install, upgrade, remove, and purge it in Debian and Ubuntu.
  deb:
    name: Debian package (${{ matrix.os }})
    needs: reproducible-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Build and test the Debian package in three distributions
        run: just deb-test
      # Built clean, like the release job, then compared with the other VM's build.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repro-sha256-${{ matrix.arch }}
          path: ${{ runner.temp }}/repro
      - name: Package matches the rebuild on another runner
        run: ci/repro/compare.sh "$RUNNER_TEMP/repro/repro-sha256.txt" target/deb/xudo_*.deb

  # The installed .deb with the broker under systemd as PID 1, in throwaway
  # containers. ci/systemd/run.sh boots systemd; the unit files are not loosened
  # to make the lane pass. Same runners as the package job: the .deb is built
  # for the runner's architecture.
  systemd:
    name: systemd broker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Installed package under systemd as PID 1
        run: just systemd-test
