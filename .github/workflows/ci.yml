name: ci

# The gate. `just verify` locally runs the same commands, so a local pass and a
# CI failure is a bug in the justfile, not in CI.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly deep fuzz and a fresh advisory check, at an off-peak minute.
    - cron: "37 4 * * *"

env:
  CARGO_TERM_COLOR: always
  # A privilege broker should not be built with an unpinned toolchain.
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the development platform and must stay green, because the
        # policy crate's whole point is that it builds and tests without Linux.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # rust-toolchain.toml pins the channel and components.
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install gate tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov,cargo-nextest,cargo-deny,cargo-audit,taplo-cli

      - name: Format
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: TOML format
        run: taplo fmt --check

      - name: Test
        run: just test

      - name: Doc tests
        run: just doc-test

      - name: Coverage (100%, three documented package exclusions)
        run: just coverage-clean && just coverage

      - name: Supply chain
        run: just supply-chain

      - name: GTFOBins gate
        run: just gtfobins

  cross:
    name: linux targets from the dev host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Type-check Linux targets
        run: just check-linux

  miri:
    name: undefined behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --component miri
      - uses: Swatinem/rust-cache@v2
      # --lib only: see the justfile's miri recipe for why.
      - run: cargo +nightly miri test -p aido-policy --lib

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    # The five trust-boundary parsers get a short run per push and a long run
    # on the nightly schedule.
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,just
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz (smoke)
        if: github.event_name != 'schedule'
        run: just fuzz-smoke
      - name: Fuzz (nightly, long)
        if: github.event_name == 'schedule'
        run: just fuzz 1800

  # Every systemd unit under packaging/, checked by systemd's own tools in a
  # Debian trixie container: `systemd-analyze verify` must say nothing, and
  # `systemd-analyze security --offline` must score each service within the
  # ceiling the justfile names. The lane first shows it can fail, against a
  # control unit it damages one way at a time. It skips, and says so, while
  # packaging/ holds no unit. Blocking from the start: once a unit exists there
  # is nothing to wait for.
  units:
    name: systemd units
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: systemd-analyze verify and security, offline, in Debian trixie
        run: just units

  # The tests that must run as uid 0, run as real root in a throwaway container,
  # on a copy of the checkout, and nothing else (ci/root-test.sh says why not the
  # whole suite). Until the install executor's own root tests land (M2b step 5)
  # the lane runs only its own checks that a run which says it is root behaves
  # like one, so it is NON-BLOCKING: `continue-on-error` below is what makes a
  # red lane leave the run green.
  #
  # THE SWITCH, in the commit that merges the install executor's root tests:
  #   1. delete `continue-on-error: true` below;
  #   2. add `root-test` to the `ci` recipe in the justfile;
  #   3. if branch protection lists required checks, add this job's name.
  # docs/CONCERNS.md, 2026-10-21, has the reasoning.
  root-tests:
    name: root tests (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Root tests, as uid 0, on a copy of the checkout
        run: just root-test

  # The differential compliance matrix: the static binary and the shipped
  # ruleset driven inside real distributions against real sudo, sudo-rs,
  # OpenDoas, and no escalator at all. ci/differential/run.sh pins what each
  # backend is probed to support, asks each backend's own parser to accept the
  # snippet aido would write, and requires every verdict to be identical in
  # every row.
  #
  # It compares only what the unprivileged binary does, and says so: row.sh
  # fails the moment `aido doctor` stops reporting the exec path as absent,
  # because then the same ruleset must be *executed* through each backend and
  # compared, and "we will add it later" is how it never gets added.
  differential:
    name: differential compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Drive the static binary through sudo, sudo-rs, OpenDoas, and no escalator
        run: just differential
