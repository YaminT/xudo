# T2/T3 · package install and removal.
#
# This tier is, by construction, a transitive grant of arbitrary root code
# execution, bounded only by the trust placed in the configured, root-owned
# repositories. That is stated plainly rather than papered over: maintainer
# scripts run as root by design.
#
# What the rules can still do is make every *other* route unreachable. The
# deb-name matcher rejects "/", "=", ":", a leading "-", a trailing "-", and
# "..", so `apt-get install ./local.deb`, a version-pinned downgrade, an
# architecture qualifier, a URL install, and `apt-get install pkg-` (which
# removes pkg) are all unrepresentable. A trailing "+" stays: g++ is a real
# name, and pkg+ asks apt to install. The install action also requires the
# literal --no-remove, in the option group before the verb, so an install
# that would remove a conflicting package is refused. The operator removes
# that package with xudo.pkg.remove, which always confirms. The compiled-in
# deny-list independently refuses `-o`/`--option`/`--config-file`, because
# `apt-get -o DPkg::Pre-Invoke::='...'` is a /bin/sh-as-root injection through a
# rule that only meant to install a package.
#
# Removal is capped at 10 names and requires confirmation: `apt-get remove X`
# can resolve into hundreds of removals, including the toolchain the agent is
# standing on.

[[action]]
id = "xudo.pkg.install"
tier = "pkg-install"
exe = "/usr/bin/apt-get"
args = [
  { name = "assume-yes", matcher = { literal = "-y" } },
  { name = "no-recommends", matcher = { literal = "--no-install-recommends" } },
  { name = "no-remove", matcher = { literal = "--no-remove" } },
  { name = "verb", matcher = { literal = "install" } },
  { name = "separator", matcher = { literal = "--" } },
  { name = "pkg", matcher = { name = "deb-name" }, repeat = { between = { min = 1, max = 20 } } },
]

[[action]]
id = "xudo.pkg.update"
tier = "pkg-install"
exe = "/usr/bin/apt-get"
args = [{ name = "verb", matcher = { literal = "update" } }]

[[action]]
id = "xudo.pkg.remove"
tier = "pkg-remove"
exe = "/usr/bin/apt-get"
confirm = "always"
args = [
  { name = "assume-yes", matcher = { literal = "-y" } },
  { name = "verb", matcher = { literal = "remove" } },
  { name = "separator", matcher = { literal = "--" } },
  { name = "pkg", matcher = { name = "deb-name" }, repeat = { between = { min = 1, max = 10 } } },
]

[[action]]
id = "xudo.pkg.dry-run-install"
tier = "diag-read"
# Simulation only. This is what the broker runs to render a preview into the
# confirmation prompt, so a human approving a removal sees what will actually go.
exe = "/usr/bin/apt-get"
args = [
  { name = "simulate", matcher = { literal = "-s" } },
  { name = "verb", matcher = { literal = "install" } },
  { name = "separator", matcher = { literal = "--" } },
  { name = "pkg", matcher = { name = "deb-name" }, repeat = { between = { min = 1, max = 20 } } },
]

# Tests run by `xudo check` and by the build.

[[test]]
argv = [
  "/usr/bin/apt-get",
  "-y",
  "--no-install-recommends",
  "--no-remove",
  "install",
  "--",
  "ripgrep",
]
expect = "allow"
action = "xudo.pkg.install"

[[test]]
argv = ["/usr/bin/apt-get", "update"]
expect = "allow"
action = "xudo.pkg.update"

[[test]]
argv = ["/usr/bin/apt-get", "-y", "remove", "--", "ripgrep"]
expect = "confirm"
action = "xudo.pkg.remove"
reason = "removal always asks a human"

[[test]]
argv = ["/usr/bin/apt-get", "-s", "install", "--", "ripgrep"]
expect = "allow"
action = "xudo.pkg.dry-run-install"

[[test]]
argv = [
  "/usr/bin/apt-get",
  "-y",
  "--no-install-recommends",
  "--no-remove",
  "install",
  "--",
  "./local.deb",
]
expect = "deny"
reason = "near miss: a local file is not a package name"

[[test]]
argv = [
  "/usr/bin/apt-get",
  "-y",
  "--no-install-recommends",
  "--no-remove",
  "install",
  "--",
  "apparmor-",
]
expect = "deny"
reason = "a trailing hyphen removes the package through install"

[[test]]
argv = [
  "/usr/bin/apt-get",
  "-o",
  "DPkg::Pre-Invoke::=/bin/sh",
  "-y",
  "--no-install-recommends",
  "--no-remove",
  "install",
  "--",
  "ripgrep",
]
expect = "deny"
reason = "no rule accepts -o, which names a program to run as root"
