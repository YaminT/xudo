# T1 · svc-control — changes running state, never a unit definition.
#
# The verb list is an enumeration, not a pattern. Every unit-definition-mutating
# verb (enable, disable, mask, unmask, link, revert, edit, set-property, …) is
# excluded by not appearing here, AND independently refused by the compiled-in
# deny-list, because a tier boundary that depends on one list being complete is
# not a boundary.
#
# There is no shipped service-lifecycle rule. Restarting a service is an
# enumeration the operator writes per host: copy
# /usr/share/xudo/examples/20-services-lifecycle.toml into this directory
# and replace the placeholder units. The source of that example is
# rules/examples/20-services-lifecycle.toml.example, which the loader cannot
# read (the name does not end in `.toml`).
#
# reset-failed takes service-unit-name: a `.service` with no `@` and no
# backslash. It does not start or stop the unit. The generic unit-name kind
# still accepts `.target`, `.mount`, templates, and escapes, because the
# journal rules use it to name any unit whose log is being read. A suffix-less
# name is still refused: `systemctl restart foo` resolves `foo` to
# `foo.service`.
#
# The compiled-in deny-list also refuses, on a verb that acts, a power or boot target
# (including runlevel0, runlevel1, and runlevel6), the systemd power services,
# `debug-shell`, `modprobe@`, the fsck/growfs/makefs and `mdadm*@` templates,
# `xudod` and `xudo-*` units, the journal and rsyslog units, the firewall
# units, the time-sync units, and `apparmor` / `auditd`. A later rule that
# lists one of those units cannot reopen it.

[[action]]
id = "xudo.svc.reset-failed"
tier = "svc-control"
exe = "/usr/bin/systemctl"
args = [
  { name = "no-pager", matcher = { literal = "--no-pager" } },
  { name = "verb", matcher = { literal = "reset-failed" } },
  { name = "unit", matcher = { name = "service-unit-name" } },
]

[[action]]
id = "xudo.svc.reload-units"
tier = "svc-control"
exe = "/usr/bin/systemctl"
# Zero arguments beyond the pinned flags. Note that daemon-reload re-reads every
# unit search path, so this is only as safe as those directories' ownership,
# which xudo-sys verifies before the gate execs.
args = [
  { name = "no-pager", matcher = { literal = "--no-pager" } },
  { name = "verb", matcher = { literal = "daemon-reload" } },
]

# Tests run by `xudo check` and by the build.

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "restart",
  "nginx.service",
]
expect = "deny"
reason = "no shipped rule restarts a service; copy the lifecycle example and list the unit"

[[test]]
argv = ["/usr/bin/systemctl", "--no-pager", "reset-failed", "nginx.service"]
expect = "allow"
action = "xudo.svc.reset-failed"

[[test]]
argv = ["/usr/bin/systemctl", "--no-pager", "daemon-reload"]
expect = "allow"
action = "xudo.svc.reload-units"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "restart",
  "nginx",
]
expect = "deny"
reason = "near miss: a unit name needs its suffix"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "enable",
  "nginx.service",
]
expect = "deny"
reason = "no rule accepts enable, which changes a unit definition"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "start",
  "poweroff.target",
]
expect = "deny"
reason = "near miss: a power target is not a service"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "start",
  "modprobe@dummy.service",
]
expect = "deny"
reason = "near miss: a template unit can load a kernel module"
