# T1 · svc-control — changes running state, never a unit definition.
#
# The verb list is an enumeration, not a pattern. Every unit-definition-mutating
# verb (enable, disable, mask, unmask, link, revert, edit, set-property, …) is
# excluded by not appearing here, AND independently refused by the compiled-in
# deny-list, because a tier boundary that depends on one list being complete is
# not a boundary.
#
# Lifecycle and reset-failed take service-unit-name: a `.service` with no `@`
# and no backslash. The generic unit-name kind still accepts `.target`,
# `.mount`, templates, and escapes, because the journal rules use it to name
# any unit whose log is being read. A suffix-less name is still refused:
# `systemctl restart foo` resolves `foo` to `foo.service`.
#
# The compiled-in deny-list also refuses, on any verb, a power or boot target,
# `modprobe@`, the fsck/growfs/makefs and `mdadm*@` templates, `xudod` and
# `xudo-*` units, and `apparmor` / `auditd`. A later rule that goes back to
# unit-name cannot reopen those.

[[action]]
id = "xudo.svc.lifecycle"
tier = "svc-control"
exe = "/usr/bin/systemctl"
args = [
  { name = "no-pager", matcher = { literal = "--no-pager" } },
  { name = "no-ask", matcher = { literal = "--no-ask-password" } },
  { name = "verb", matcher = { one-of = [
    "start",
    "stop",
    "restart",
    "try-restart",
    "reload",
    "reload-or-restart",
    "try-reload-or-restart",
  ] } },
  { name = "unit", matcher = { name = "service-unit-name" } },
]

[[action]]
id = "xudo.svc.reset-failed"
tier = "svc-control"
exe = "/usr/bin/systemctl"
args = [
  { name = "no-pager", matcher = { literal = "--no-pager" } },
  { name = "verb", matcher = { literal = "reset-failed" } },
  { name = "unit", matcher = { name = "service-unit-name" } },
]

[[action]]
id = "xudo.svc.reload-units"
tier = "svc-control"
exe = "/usr/bin/systemctl"
# Zero arguments beyond the pinned flags. Note that daemon-reload re-reads every
# unit search path, so this is only as safe as those directories' ownership,
# which xudo-sys verifies before the gate execs.
args = [
  { name = "no-pager", matcher = { literal = "--no-pager" } },
  { name = "verb", matcher = { literal = "daemon-reload" } },
]

# Tests run by `xudo check` and by the build.

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "restart",
  "nginx.service",
]
expect = "allow"
action = "xudo.svc.lifecycle"

[[test]]
argv = ["/usr/bin/systemctl", "--no-pager", "reset-failed", "nginx.service"]
expect = "allow"
action = "xudo.svc.reset-failed"

[[test]]
argv = ["/usr/bin/systemctl", "--no-pager", "daemon-reload"]
expect = "allow"
action = "xudo.svc.reload-units"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "restart",
  "nginx",
]
expect = "deny"
reason = "near miss: a unit name needs its suffix"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "enable",
  "nginx.service",
]
expect = "deny"
reason = "no rule accepts enable, which changes a unit definition"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "start",
  "poweroff.target",
]
expect = "deny"
reason = "near miss: a power target is not a service"

[[test]]
argv = [
  "/usr/bin/systemctl",
  "--no-pager",
  "--no-ask-password",
  "start",
  "modprobe@dummy.service",
]
expect = "deny"
reason = "near miss: a template unit can load a kernel module"
