# The action `xudo install` runs to see the gate work as root: print the
# effective uid, nothing else. The single literal argument leaves `-un`, `-G`
# and a username (which would read another account) unmatched.
#
# Two programs, one shape. Install runs the first whose executable is, at that
# moment, a regular file. `/usr/bin/id` is that file on Debian and Ubuntu 24.04.
# On Ubuntu 26.04 it is a uutils symlink, and `/usr/bin/gnuid` is the regular
# GNU binary. A symlink is never a probe, and neither is a missing path.

[[action]]
id = "xudo.probe.id"
tier = "diag-read"
exe = "/usr/bin/id"
args = [{ name = "effective-uid", matcher = { literal = "-u" } }]

[[action]]
id = "xudo.probe.gnuid"
tier = "diag-read"
exe = "/usr/bin/gnuid"
args = [{ name = "effective-uid", matcher = { literal = "-u" } }]

# Tests run by `xudo check` and by the build. A test is not policy: it can only
# say what the rules above are expected to decide.

[[test]]
argv = ["/usr/bin/id", "-u"]
expect = "allow"
action = "xudo.probe.id"
reason = "the probe `xudo install` runs"

[[test]]
argv = ["/usr/bin/gnuid", "-u"]
expect = "allow"
action = "xudo.probe.gnuid"

[[test]]
argv = ["/usr/bin/id", "-un"]
expect = "deny"
reason = "near miss: -un prints a name, and the rule matches one literal"

[[test]]
argv = ["/usr/bin/id", "-u", "root"]
expect = "deny"
reason = "a username would read another account"
