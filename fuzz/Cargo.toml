# The trust-boundary parsers, fuzzed separately.
#
# Not a workspace member: cargo-fuzz needs nightly and its own profile, and the
# main workspace must stay buildable on the pinned stable toolchain.
[package]
name = "xudo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
xudo-policy = { path = "../crates/xudo-policy" }
xudo-wire = { path = "../crates/xudo-wire" }
xudo-gate = { path = "../crates/xudo-gate", features = ["fuzzing"] }
xudod = { path = "../crates/xudod", features = ["fuzzing"] }
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = [
  "parse",
  "display",
  "serde",
] }

[[bin]]
name = "rules_toml"
path = "fuzz_targets/rules_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "argv_canon"
path = "fuzz_targets/argv_canon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "denylist_eval"
path = "fuzz_targets/denylist_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_request"
path = "fuzz_targets/wire_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_response"
path = "fuzz_targets/wire_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spool_entry"
path = "fuzz_targets/spool_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "confirm_file"
path = "fuzz_targets/confirm_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "freeze_file"
path = "fuzz_targets/freeze_file.rs"
test = false
doc = false
bench = false
