# The five trust-boundary parsers, fuzzed separately.
#
# Not a workspace member: cargo-fuzz needs nightly and its own profile, and the
# main workspace must stay buildable on the pinned stable toolchain.
[package]
name = "aido-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
aido-policy = { path = "../crates/aido-policy" }
aido-wire = { path = "../crates/aido-wire" }
arbitrary = { version = "1", features = ["derive"] }

[[bin]]
name = "rules_toml"
path = "fuzz_targets/rules_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "argv_canon"
path = "fuzz_targets/argv_canon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "denylist_eval"
path = "fuzz_targets/denylist_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_request"
path = "fuzz_targets/wire_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_response"
path = "fuzz_targets/wire_response.rs"
test = false
doc = false
bench = false
