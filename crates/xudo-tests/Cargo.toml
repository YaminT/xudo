[package]
name = "xudo-tests"
description = "Tests that belong to the workspace as a whole: the crate inventories name exactly the workspace members. Reserved for the executing half of the differential compliance matrix across sudo, sudo-rs, and OpenDoas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The differential matrix that exists today lives in `ci/differential/` and is
# run by `just differential`: a shell harness, because its job is to start
# containers and drive the static binary inside them. This package is reserved
# for the half that needs a gate binary — the same ruleset *executed* through
# each backend. Until then it holds only the tests that belong to no one crate:
# `tests/crate_inventory.rs` reads the workspace's own manifest and docs with
# the standard library alone, so this package
# has next to none: only `rustix`, for the guard.
#
# The end-to-end tests of the `xudo` binary are not here. They live in
# `xudo-bin/tests`, because only the package that owns a binary gets
# `CARGO_BIN_EXE_<name>` and a guaranteed-fresh build of it.

# The root-lane guard (`src/root_lane.rs`) asks for the effective uid, which the
# standard library cannot, and `unsafe` is forbidden. A feature of a crate
# already in the tree, not a new one.
[dependencies]
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "process",
] }

[lints]
workspace = true
