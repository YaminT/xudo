[package]
name = "xudo"
description = "Agent-aware privilege broker for Linux: the unprivileged front-end library. It decides nothing and holds no secret."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
xudo-audit = { path = "../xudo-audit", version = "0.1.0-beta.1" }
xudo-backend = { path = "../xudo-backend", version = "0.1.0-beta.1" }
xudo-config = { path = "../xudo-config", version = "0.1.0-beta.1" }
xudo-policy = { path = "../xudo-policy", version = "0.1.0-beta.1" }
xudo-sys = { path = "../xudo-sys", version = "0.1.0-beta.1" }
xudo-wire = { path = "../xudo-wire", version = "0.1.0-beta.1" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Paths, rule text, and names in `doctor`'s report come from the machine, and
# a world-writable directory lets anyone choose a file name.
term-sanitize = { path = "../term-sanitize", version = "0.1.0-beta.1" }
thiserror.workspace = true
# `net` is the broker exchange: a non-blocking connect, then `SO_SNDTIMEO` /
# `SO_RCVTIMEO` shrunk to the time still left. Same crate the terminal already
# uses; not a new dependency.
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "termios",
  "event",
  "net",
] }

[dev-dependencies]
insta.workspace = true
tempfile = "3"
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "termios",
  "pty",
  "fs",
] }

[lints]
workspace = true
