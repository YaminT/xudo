[package]
name = "xudo"
description = "Agent-aware privilege broker for Linux: the unprivileged front-end library. It decides nothing and holds no secret."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
xudo-audit = { path = "../xudo-audit", version = "0.0.1" }
xudo-backend = { path = "../xudo-backend", version = "0.0.1" }
xudo-config = { path = "../xudo-config", version = "0.0.1" }
xudo-policy = { path = "../xudo-policy", version = "0.0.1" }
xudo-sys = { path = "../xudo-sys", version = "0.0.1" }
xudo-wire = { path = "../xudo-wire", version = "0.0.1" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Paths, rule text, and names in `doctor`'s report come from the machine, and
# a world-writable directory lets anyone choose a file name.
term-sanitize = { path = "../term-sanitize", version = "0.0.1" }
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile = "3"

[lints]
workspace = true
