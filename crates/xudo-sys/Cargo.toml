[package]
name = "xudo-sys"
description = "Platform abstraction for xudo: /proc parsing, ancestry walking, and caller classification behind traits with in-memory fakes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
xudo-audit = { path = "../xudo-audit", version = "0.0.1" }
xudo-backend = { path = "../xudo-backend", version = "0.0.1" }
xudo-policy = { path = "../xudo-policy", version = "0.0.1" }
# The five system calls that need `unsafe`. The only crate that may depend on
# it; everything else reaches those calls through `Syscalls`.
xudo-sys-raw = { path = "../xudo-sys-raw", version = "0.0.1" }
bstr.workspace = true
# Descriptor-relative opens and `fstat`, through rustix's safe API, so the
# ruleset is verified on the descriptors it is read through. Two users share
# the features: the broker's safe calls (below) and `live.rs`, which reads this
# process's own ids and groups (process) for `doctor`'s report of other paths
# to root. The broker's calls: the socket checks and `SO_PEERCRED` (net),
# `pidfd_open` (process), the liveness poll (event), `CLOCK_MONOTONIC` (time),
# and `getrandom` (rand). The gate's come from it too: `PR_SET_NO_NEW_PRIVS`
# (thread) and the `dup2` that fills a closed standard stream (stdio).
# Features of a crate already in the tree, not new crates.
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "fs",
  "net",
  "process",
  "event",
  "time",
  "rand",
  "stdio",
  "thread",
] }
# The digest the gate takes of the program it is about to exec, on the
# descriptor it exec's.
sha2.workspace = true
thiserror.workspace = true

# The Linux tests start a real peer process and bound its connection with
# SO_RCVTIMEO, so a connector that fails cannot hang the suite.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "fs",
  "net",
] }


# The journald audit mirror: one datagram per record to journald's native
# socket, through rustix's safe socket API. Linux only, as journald is.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "fs",
  "net",
] }

[features]
# `FakeAuditSink`, for the tests of code that must record before it acts. A
# sink that issues receipts without writing anything must not be linkable into
# a shipped binary, so it exists only where a test build asks for it.
fake = []
# The tests that must run as uid 0: every `tests/root_*.rs`. Only
# `ci/root-test.sh` (`just root-test`) runs them as root. The suites that enable
# every feature build them and let them skip, loudly, as anyone else. Nothing
# shipped reads this feature; it selects tests and changes no behaviour.
root-tests = []

# Without the feature the target does not exist, so a run that forgot it fails
# ("requires the features") rather than running an empty binary and passing.
[[test]]
name = "root_lane"
required-features = ["root-tests"]

[[test]]
name = "root_install"
required-features = ["root-tests"]

[[test]]
name = "root_sudo_names"
required-features = ["root-tests"]

[dev-dependencies]
# The root-lane guard every `tests/root_*.rs` begins with.
xudo-tests = { path = "../xudo-tests", version = "0.0.1" }
# The system log's path must be the one the configuration crate names, and the
# journal's alert priority must meet the gate's high-severity mark; both are
# checked against the other crate rather than restated.
xudo-config = { path = "../xudo-config", version = "0.0.1" }
xudo-gate = { path = "../xudo-gate", version = "0.0.1" }
# The mountinfo parser is held to the kernel's escaping for arbitrary bytes.
proptest.workspace = true

[lints]
workspace = true
