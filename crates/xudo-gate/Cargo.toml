[package]
name = "xudo-gate"
description = "The privileged gate's library: a second, independent policy engine that assumes a hostile local user invoked it directly. Pure decision modules, plus a `run` sequence that drives the host only through `xudo-sys` traits and makes no syscall of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
xudo-audit = { path = "../xudo-audit", version = "0.0.1" }
xudo-policy = { path = "../xudo-policy", version = "0.0.1" }
# The seams the gate's sequence is written against: syscalls, `/proc`, the
# trust walk, the spool, the audit sink, the clock. Traits with fakes, so every
# step is reached by a test on a laptop; `xudo-sys` dev-depends on this crate
# for its own contract test, which cargo allows.
xudo-sys = { path = "../xudo-sys", version = "0.0.1" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `FakeAuditSink`, which exists only where a test build asks for it, and the
# path the configuration crate names for the rules, which the gate must agree
# with rather than restate.
xudo-config = { path = "../xudo-config", version = "0.0.1" }
xudo-sys = { path = "../xudo-sys", version = "0.0.1", features = ["fake"] }

[lints]
workspace = true
