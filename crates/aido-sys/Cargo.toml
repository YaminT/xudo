[package]
name = "aido-sys"
description = "Platform abstraction for aido: /proc parsing, ancestry walking, and caller classification behind traits with in-memory fakes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aido-backend = { path = "../aido-backend", version = "0.0.1" }
aido-policy = { path = "../aido-policy", version = "0.0.1" }
bstr.workspace = true
# Descriptor-relative opens and `fstat`, through rustix's safe API, so the
# ruleset is verified on the descriptors it is read through.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
thiserror.workspace = true

# The four calls rustix cannot make safely, used only by `src/raw.rs`. Already
# in the tree through rustix's own dependencies, so no new crate to audit.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.189", default-features = false }

[dev-dependencies]
toml.workspace = true

# Not `workspace = true`. This is the one crate that must lower
# `unsafe_code` from `forbid`, which no inner `allow` can lift, to `deny`, so
# that `raw` alone can allow it. Cargo cannot override one inherited lint, so
# the table is a copy, and `tests/unsafe_budget.rs` fails if it differs from
# `[workspace.lints]` in anything but that line.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"
disallowed_methods = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "allow"
module_name_repetitions = "allow"
