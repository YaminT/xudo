[package]
name = "aidod"
description = "The root broker's logic: identifies its peer from the kernel, evaluates the request against root's ruleset with the function aido explain uses, and mints the spool entry the gate acts on. Every syscall behind aido-sys's seams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aido-audit = { path = "../aido-audit", version = "0.0.1" }
aido-backend = { path = "../aido-backend", version = "0.0.1" }
aido-config = { path = "../aido-config", version = "0.0.1" }
aido-gate = { path = "../aido-gate", version = "0.0.1" }
aido-policy = { path = "../aido-policy", version = "0.0.1" }
aido-sys = { path = "../aido-sys", version = "0.0.1" }
aido-wire = { path = "../aido-wire", version = "0.0.1" }
thiserror.workspace = true

[dev-dependencies]
# The in-memory trail every `serve` test records through.
aido-sys = { path = "../aido-sys", version = "0.0.1", features = ["fake"] }
insta.workspace = true
# Errno values, to script the answers a real kernel gives; and in the Linux
# tests, `waitid(WNOWAIT)` to hold a peer as a zombie, and this process's ids.
rustix = { version = "1.1", default-features = false, features = [
  "std",
  "process",
] }
serde_json.workspace = true

[lints]
workspace = true
