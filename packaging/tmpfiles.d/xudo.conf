# /run/xudo is 0755 so a member of the xudo group can reach broker.sock, which
# systemd creates 0660 root:xudo. The spool is root's alone: the broker writes
# entries there and the gate reads them, both as root. Entries expire after
# fifteen minutes and the broker removes them; /run is empty at boot.
#
# crates/xudod/tests/units.rs asserts both lines.
#
# Type Path           Mode User Group Age Argument
d      /run/xudo      0755 root root  -   -
d      /run/xudo/req  0700 root root  -   -
